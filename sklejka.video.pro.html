<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a22">
<title>Склейка — монтаж ролика на телефоне</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef3f4; --surface:#ffffff; --line:#cddbe0; --text:#10222c; --muted:#557080;
  --accent:#b3660a; --accent-ink:#ffffff; --sea:#1f7f8c; --danger:#b23a2e;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e1a22; --surface:#162733; --line:#27414f; --text:#e9f0f2; --muted:#8fa6b1;
    --accent:#f2b35d; --accent-ink:#1d1408; --sea:#5fc0cb; --danger:#ff8a7a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e1a22; --surface:#162733; --line:#27414f; --text:#e9f0f2; --muted:#8fa6b1;
  --accent:#f2b35d; --accent-ink:#1d1408; --sea:#5fc0cb; --danger:#ff8a7a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 200px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbtns{display:flex;align-items:center;gap:8px}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.iconbtn svg,.lang svg{width:20px;height:20px;flex:none}
.lang{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;font-size:.85rem}
.lang select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.lang:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;padding:6px 10px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;min-height:42px;padding:6px 10px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:600;font-size:.95rem;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
.panel[hidden]{display:none}
.panel > h2:first-child{border-top:0;padding-top:0;margin-top:16px}
.panel > .row:first-child,.panel > label.sl:first-child{margin-top:16px}
header{padding:20px 0 12px}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--muted);max-width:34em}

.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:6px 0 0;margin:0 -16px;border-bottom:1px solid var(--line)}
.screen{position:relative;background:#000;display:flex;justify-content:center}
canvas#cv{display:block;max-width:100%;max-height:34vh;width:auto;height:auto}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#c9d6db;padding:16px;font-size:.95rem}
.empty[hidden]{display:none}

h2{font-family:var(--display);font-weight:500;font-size:1rem;margin:30px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
h2.first{border-top:0;padding-top:0;margin-top:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.row > span.lbl{flex:0 0 100%;color:var(--muted);font-size:.9rem;margin-bottom:-2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.note{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.note.warn{color:var(--danger)}

.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:1.5px dashed var(--sea);border-radius:12px;background:transparent;color:var(--sea);font-weight:600;margin-top:10px;cursor:pointer}
.add input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.add:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.auto{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.auto[hidden]{display:none}
.auto button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem;padding:6px 8px}
.auto button.smart{grid-column:1 / -1;background:var(--text);color:var(--bg);border-color:var(--text);min-height:50px}

ol.clips{list-style:none;margin:0;padding:0}
.clip{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.clip.bad{border-color:var(--danger)}
.clip-head{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px;text-align:start}
.clip-head img,.clip-head .ph{width:72px;height:40px;border-radius:6px;object-fit:cover;background:#000;flex:none}
.clip-head .num{font-family:var(--display);font-size:.8rem;width:1.6em;text-align:center;color:var(--muted);flex:none}
.clip-head .meta{min-width:0;flex:1}
.clip-head .name{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.85rem;color:var(--muted)}
.clip-head .cut{display:block;font-weight:600;font-size:.95rem}
.clip-head .chev{flex:none;color:var(--muted);transition:transform .15s}
.clip.open .chev{transform:rotate(180deg)}
.clip-body{display:none;padding:4px 12px 12px;border-top:1px solid var(--line)}
.clip.open .clip-body{display:block}
label.sl{display:block;margin-top:12px;font-size:.9rem;color:var(--muted)}
label.sl b{color:var(--text);font-weight:600}
input[type=range]{width:100%;height:36px;accent-color:var(--accent);margin:0;display:block}
.mini{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.mini .lbl{color:var(--muted);font-size:.9rem;flex:0 0 100%}
.mini .chip{min-height:38px;padding:6px 12px;font-size:.9rem}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.tools button{min-height:42px;border:1px solid var(--line);background:transparent;border-radius:10px;font-size:.9rem}
.tools button.del{color:var(--danger)}
.tools button:disabled{opacity:.35}

input[type=text]{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:8px 12px}
details{margin-top:10px}
summary{cursor:pointer;color:var(--sea);font-weight:600;padding:8px 0}
.linkbtn{background:none;border:0;padding:8px 0;color:var(--sea);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.music{display:flex;gap:8px;align-items:center;margin:10px 0}
.music .pick{position:relative;display:inline-flex;align-items:center;min-height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-weight:600;cursor:pointer;flex:none}
.music .pick input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.music .pick:focus-within{outline:2px solid var(--sea);outline-offset:2px}
.music .mname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:.9rem}
.colors{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0}
.colors[hidden]{display:none}
.colors label{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.colors input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:3px}
.add[hidden]{display:none}
.ver{color:var(--muted);font-size:.8rem;margin-top:28px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto}
.total{display:flex;justify-content:space-between;align-items:baseline;font-size:.9rem;color:var(--muted)}
.total b{font-family:var(--display);font-weight:500;color:var(--text);font-size:1rem}
.gauge{height:6px;background:var(--line);border-radius:3px;margin:6px 0 10px;overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--sea);border-radius:3px}
.gauge i.hit{background:var(--accent)}
.acts{display:flex;gap:8px}
.acts button{flex:1;min-height:50px;border-radius:12px;font-weight:600;border:1.5px solid var(--text);background:transparent}
.acts button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.acts button:disabled{opacity:.4}
.msg{margin:8px 0 0;font-size:.9rem;color:var(--muted);min-height:1.3em}
.msg.err{color:var(--danger)}

.result{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.result[hidden]{display:none}
.result-in{max-width:560px;margin:0 auto}
.result video{display:block;width:100%;max-height:52vh;background:#000;border-radius:8px;margin:14px 0}
.result .acts{flex-direction:column}
#pool{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
#pool video{width:2px;height:2px}
main[inert]{opacity:.55}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top">
      <h1>Склейка</h1>
      <div class="topbtns">
        <button type="button" class="iconbtn" id="themeBtn" data-i-aria="theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>
        </button>
        <label class="lang" data-i-aria="lang">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.6 2.4 3.9 5.2 3.9 8.5s-1.3 6.1-3.9 8.5c-2.6-2.4-3.9-5.2-3.9-8.5S9.4 5.9 12 3.5z"/></svg>
          <span id="langCode">RU</span>
          <select id="langSel"></select>
        </label>
      </div>
    </div>
    <p data-i="sub"></p>
  </header>

  <div class="stage">
    <div class="screen">
      <canvas id="cv" width="1280" height="720"></canvas>
      <div class="empty" id="empty" data-i="empty"></div>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="clips" data-i="tab_clips"></button>
      <button type="button" role="tab" data-tab="format" data-i="h_format"></button>
      <button type="button" role="tab" data-tab="pic" data-i="h_pic"></button>
      <button type="button" role="tab" data-tab="edit" data-i="h_edit"></button>
      <button type="button" role="tab" data-tab="sound" data-i="h_sound"></button>
      <button type="button" role="tab" data-tab="more" data-i="tab_more"></button>
    </nav>
  </div>

  <main id="main">
    <section class="panel" data-panel="clips">
      <h2 data-i="h_clips"></h2>
      <ol class="clips" id="clips"></ol>
      <label class="add">
        <input type="file" id="file" accept="video/*,image/*" multiple>
        <span aria-hidden="true">＋</span> <span data-i="add"></span>
      </label>
      <div class="auto" id="auto" hidden>
        <button type="button" id="smart" class="smart" data-i="smart"></button>
        <button type="button" id="random" data-i="random"></button>
        <button type="button" id="fit" data-i="even"></button>
      </div>
      <p class="note" id="autoNote" hidden data-i="autoNote"></p>
    </section>

    <section class="panel" data-panel="format" hidden>
      <h2 data-i="h_where"></h2>
      <div class="row" id="presets"><span class="lbl" data-i="presets"></span>
        <button class="chip" data-preset="reels">Reels, TikTok, Shorts</button>
        <button class="chip" data-preset="youtube">YouTube</button>
        <button class="chip" data-preset="post" data-i="p_post"></button>
        <button class="chip" data-preset="cinema" data-i="p_cinema"></button>
      </div>
      <h2 data-i="h_format"></h2>
      <div class="row" data-set="target"><span class="lbl" data-i="length"></span>
        <button class="chip" data-v="15"></button>
        <button class="chip" data-v="30"></button>
        <button class="chip" data-v="60"></button>
        <button class="chip" data-v="180"></button>
        <button class="chip" data-v="300"></button>
        <button class="chip" data-v="600"></button>
      </div>
      <div class="row" data-set="frame"><span class="lbl" data-i="frame"></span>
        <button class="chip" data-v="cinema" data-i="f_cinema"></button>
        <button class="chip" data-v="wide" data-i="f_wide"></button>
        <button class="chip" data-v="vertical" data-i="f_vert"></button>
        <button class="chip" data-v="four5" data-i="f_45"></button>
        <button class="chip" data-v="square" data-i="f_sq"></button>
      </div>
      <div class="row" data-set="quality"><span class="lbl" data-i="res"></span>
        <button class="chip" data-v="360">360p</button>
        <button class="chip" data-v="480">480p</button>
        <button class="chip" data-v="720">720p</button>
        <button class="chip" data-v="1080">1080p</button>
        <button class="chip" data-v="1440">2K</button>
        <button class="chip" data-v="2160">4K</button>
      </div>
      <div class="row" data-set="fps"><span class="lbl" data-i="fps"></span>
        <button class="chip" data-v="24" data-i="fps24"></button>
        <button class="chip" data-v="25">25</button>
        <button class="chip" data-v="30">30</button>
        <button class="chip" data-v="60" data-i="fps60"></button>
      </div>
      <p class="note" id="sizeNote"></p>
    </section>

    <section class="panel" data-panel="pic" hidden>
      <div class="row" data-set="look" id="looks"><span class="lbl" data-i="look"></span></div>
      <label class="sl"><span data-i="power"></span> <b id="o-power"></b><input type="range" data-range="power" min="0" max="100" step="5"></label>
      <h2 data-i="fx"></h2>
      <div class="row">
        <button class="chip" data-toggle="grain" data-i="fx_grain"></button>
        <button class="chip" data-toggle="vig" data-i="fx_vig"></button>
        <button class="chip" data-toggle="push" data-i="fx_push"></button>
        <button class="chip" data-toggle="leak" data-i="fx_leak"></button>
        <button class="chip" data-toggle="glow" data-i="fx_glow"></button>
        <button class="chip" data-toggle="ca" data-i="fx_ca"></button>
        <button class="chip" data-toggle="old" data-i="fx_old"></button>
      </div>
      <h2 data-i="weather"></h2>
      <div class="row" data-set="weather">
        <button class="chip" data-v="none" data-i="w_none"></button>
        <button class="chip" data-v="rain" data-i="w_rain"></button>
        <button class="chip" data-v="snow" data-i="w_snow"></button>
        <button class="chip" data-v="fog" data-i="w_fog"></button>
        <button class="chip" data-v="rays" data-i="w_rays"></button>
        <button class="chip" data-v="dust" data-i="w_dust"></button>
        <button class="chip" data-v="heat" data-i="w_heat"></button>
      </div>
      <label class="sl"><span data-i="wxPower"></span> <b id="o-wx"></b><input type="range" data-range="wx" min="10" max="100" step="5"></label>
      <h2 data-i="stab"></h2>
      <div class="row" data-set="stab">
        <button class="chip" data-v="off" data-i="off"></button>
        <button class="chip" data-v="light" data-i="s_light"></button>
        <button class="chip" data-v="strong" data-i="s_strong"></button>
      </div>
      <p class="note" data-i="stabNote"></p>
      <details>
        <summary data-i="fine"></summary>
        <label class="sl"><span data-i="bright"></span> <b id="o-bright"></b><input type="range" data-range="bright" min="-50" max="50" step="5"></label>
        <label class="sl"><span data-i="contrast"></span> <b id="o-contrast"></b><input type="range" data-range="contrast" min="-50" max="50" step="5"></label>
        <label class="sl"><span data-i="sat"></span> <b id="o-sat"></b><input type="range" data-range="sat" min="-50" max="50" step="5"></label>
        <label class="sl"><span data-i="temp"></span> <b id="o-temp"></b><input type="range" data-range="temp" min="-50" max="50" step="5"></label>
        <button type="button" class="linkbtn" id="resetFine" data-i="resetFine"></button>
      </details>
    </section>

    <section class="panel" data-panel="edit" hidden>
      <div class="row" data-set="trans"><span class="lbl" data-i="trans"></span>
        <button class="chip" data-v="mix" data-i="t_mix"></button>
        <button class="chip" data-v="blur" data-i="t_blur"></button>
        <button class="chip" data-v="zoom" data-i="t_zoom"></button>
        <button class="chip" data-v="slide" data-i="t_slide"></button>
        <button class="chip" data-v="wipe" data-i="t_wipe"></button>
        <button class="chip" data-v="iris" data-i="t_iris"></button>
        <button class="chip" data-v="black" data-i="t_black"></button>
        <button class="chip" data-v="white" data-i="t_white"></button>
        <button class="chip" data-v="rand" data-i="t_rand"></button>
        <button class="chip" data-v="cut" data-i="t_cut"></button>
      </div>
      <label class="sl" for="title" data-i="title"></label>
      <input type="text" id="title" maxlength="60" data-i-ph="titlePh" autocomplete="off">
      <label class="sl" for="outro" data-i="outro"></label>
      <input type="text" id="outro" maxlength="60" data-i-ph="outroPh" autocomplete="off">
    </section>

    <section class="panel" data-panel="sound" hidden>
      <label class="sl"><span data-i="volVideo"></span> <b id="o-volVideo"></b><input type="range" data-range="volVideo" min="0" max="100" step="5"></label>
      <div class="music">
        <label class="pick"><input type="file" id="musicFile" accept="audio/*"><span data-i="pickMusic"></span></label>
        <span class="mname" id="musicName"></span>
        <button type="button" class="linkbtn" id="musicDel" hidden data-i="remove"></button>
      </div>
      <label class="sl"><span data-i="volMusic"></span> <b id="o-volMusic"></b><input type="range" data-range="volMusic" min="0" max="100" step="5"></label>
    </section>

    <section class="panel" data-panel="more" hidden>
      <h2 data-i="h_theme"></h2>
      <div class="row" data-set="theme"><span class="lbl" data-i="theme"></span>
        <button class="chip" data-v="auto" data-i="th_auto"></button>
        <button class="chip" data-v="light" data-i="th_light"></button>
        <button class="chip" data-v="dark" data-i="th_dark"></button>
        <button class="chip" data-v="custom" data-i="th_custom"></button>
      </div>
      <div class="colors" id="customTheme" hidden>
        <label><span data-i="thBg"></span> <input type="color" id="thBg"></label>
        <label><span data-i="thAc"></span> <input type="color" id="thAc"></label>
      </div>
      <h2 data-i="h_slow"></h2>
      <div class="row">
        <button class="chip" data-toggle="turbo" data-i="turbo"></button>
      </div>
      <p class="note" data-i="turboNote"></p>
      <h2 data-i="h_install"></h2>
      <button type="button" class="add" id="install" hidden data-i="install"></button>
      <p class="note" id="installNote" data-i="installNote"></p>
      <p class="ver">Склейка 5</p>
    </section>
  </main>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="total"><span id="totalHint"></span><b id="totalNum"></b></div>
    <div class="gauge"><i id="gauge"></i></div>
    <div class="acts">
      <button id="play" disabled></button>
      <button id="save" class="primary" disabled data-i="build"></button>
    </div>
    <p class="msg" id="msg" role="status"></p>
  </div>
</div>

<section class="result" id="result" hidden>
  <div class="result-in">
    <h1 data-i="ready"></h1>
    <video id="resVideo" controls playsinline></video>
    <div class="acts">
      <button class="primary" id="share" data-i="share"></button>
      <button id="download" data-i="save"></button>
      <button id="back" data-i="back"></button>
    </div>
    <p class="msg" id="resMsg" role="status"></p>
  </div>
</section>

<div id="pool" aria-hidden="true"></div>

<script>
(function(){
"use strict";
const $ = id => document.getElementById(id);

/* ---------- stabiliser: follows how the picture shifts and moves it back ---------- */
function profShift(A, B, R){
  const n = A.length, vals = new Float32Array(2*R+1); let best = 0, bestV = Infinity, sum = 0;
  for(let d=-R; d<=R; d++){
    let s = 0, c = 0;
    for(let x=Math.max(0,d); x<Math.min(n,n+d); x++){ s += Math.abs(B[x]-A[x-d]); c++; }
    const v = s/c; vals[d+R] = v; sum += v; if(v < bestV){ bestV = v; best = d; }
  }

  if(!(bestV < (sum/(2*R+1))*0.6)) return 0;

  if(best > -R && best < R){ const a = vals[best-1+R], c = vals[best+1+R], den = a - 2*bestV + c; if(den > 1e-9) sub = 0.5*(a-c)/den; }
  return best + sub;
}
function stabUpdate(p){
  const cfg = STAB[S.stab]; if(!cfg.k || !p.clip || p.img){ p.stab = null; return; }
  const v = p.v, vw = v.videoWidth, vh = v.videoHeight; if(!vw || !vh) return;
  renderSmall(p); gl.bindFramebuffer(gl.FRAMEBUFFER, p.fbo);
  try{ gl.readPixels(0, 0, SW, SH, gl.RGBA, gl.UNSIGNED_BYTE, smallBuf); }catch(e){ return; }

  for(let y=0, i=0; y<SH; y++){ for(let x=0; x<SW; x++, i+=4){ const l = d[i]*.3 + d[i+1]*.6 + d[i+2]*.1; col[x] += l; row[y] += l; } }

  for(let x=0;x<SW;x++){ col[x] /= SH; mc += col[x]; } mc /= SW; for(let x=0;x<SW;x++) col[x] -= mc;
  for(let y=0;y<SH;y++){ row[y] /= SW; mr += row[y]; } mr /= SH; for(let y=0;y<SH;y++) row[y] -= mr;
  const st = p.stab;
  if(!st){ p.stab = {col, row, cx:0, cy:0, mx:0, my:0, ox:0, oy:0}; return; }
  const dx = profShift(st.col, col, 14), dy = profShift(st.row, row, 9);

  st.cx += (dx || 0) * vw/SW; st.cy += (dy || 0) * vh/SH;

}

function distribute(g, need, weight, cap){

  g.forEach(c => { c.len = Math.max(Math.min(MIN_LEN, cap(c)), Math.round(c.len*10)/10); });
  const diff = need - g.reduce((a,c) => a + c.len, 0);

    const c = g.find(c => c.len + diff >= Math.min(MIN_LEN, cap(c)) && c.len + diff <= cap(c));

    const v = scanV, data = []; let prev = null, lastT = -1, lastWall = performance.now(), done = false, timer = 0;
    const fin = () => { if(done) return; done = true; clearInterval(timer); try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(e){} src.scan = data; res(); };

      const n = QW*QH, L = new Float32Array(n); let sum = 0, sum2 = 0, colr = 0;

  try{ music.pause(); }catch(e){} setMusicVol(0);
  try{ if(wake){ wake.release(); wake = null; } }catch(e){}
  $('main').inert = false;
  $('play').textContent = tx('watch');
  updateTotal();
  return R;
}
function stop(text, err){
  const R = cleanup();
  if(R && R.rec && R.rec.state !== 'inactive'){ R.rec.onstop = null; R.rec.onerror = null; try{ R.rec.stop(); }catch(e){} }
  setMsg(text || '', err);
  refreshStill();
}
function finish(){
  const R = cleanup();
  if(!R.record || !R.rec){ setMsg(''); refreshStill(); return; }
  setMsg(tx('m_saving'));
  R.rec.onstop = () => {
    const type = (R.rec.mimeType || R.mime || 'video/webm').split(';')[0];
    const blob = new Blob(R.chunks, {type});
    if(!blob.size){ setMsg(tx('m_recFail'), true); refreshStill(); return; }
    setMsg('');
    showResult(blob, type.indexOf('mp4') >= 0 ? 'mp4' : 'webm', R.frames/Math.max(1, R.total) < S.fps*.6);
  };
  try{ R.rec.stop(); }catch(e){ setMsg(tx('m_recFail'), true); }
}
$('play').addEventListener('click', () => { if(running) stop(running.record ? tx('m_cancelled') : ''); else start(false); });
$('save').addEventListener('click', () => start(true));
document.addEventListener('visibilitychange', () => { if(document.hidden && running){ stop(running.record ? tx('m_hidden') : '', true); } });

/* ---------- result ---------- */
let resBlob = null, resExt = 'mp4', resUrl = null, resName = '', dl;
function showResult(blob, ext, slow){
  resBlob = blob; resExt = ext;
  const d = new Date(), pad = n => String(n).padStart(2,'0');
  resName = 'sklejka-' + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()) + '.' + ext;
  if(resUrl) URL.revokeObjectURL(resUrl);
  resUrl = URL.createObjectURL(blob);
  $('resVideo').src = resUrl;
  $('resMsg').textContent = slow ? tx('m_slow') : '';
  $('resMsg').classList.remove('err');
  $('result').hidden = false;
}
$('back').addEventListener('click', () => { try{ $('resVideo').pause(); }catch(e){} $('result').hidden = true; refreshStill(); });
$('share').addEventListener('click', async () => {
  if(!resBlob) return;
  const m = $('resMsg'); m.classList.remove('err');
  let file = null; try{ file = new File([resBlob], resName, {type: resBlob.type}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Склейка'}); m.textContent = resExt === 'webm' ? tx('m_webm') : ''; }
    catch(e){ if(!e || e.name !== 'AbortError'){ m.textContent = tx('m_shareFail'); m.classList.add('err'); } }
  } else {
    m.textContent = tx('m_shareNo');
  }
});
$('download').addEventListener('click', async () => {
  if(!resBlob) return;
  const m = $('resMsg'); m.classList.remove('err');
  const filename = resName;
  m.textContent = tx('m_saving');
  if(dl === undefined){ try{ dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null; }catch(e){ dl = null; } }
  if(dl){
    try{ await dl.save({filename, data: resBlob}); m.textContent = tx('m_saved', filename); }
    catch(e){
      const code = e && e.code;
      if(code === 'declined'){ m.textContent = tx('m_declined'); }
      else if(code === 'rate_limited'){ m.textContent = tx('m_wait'); }
      else if(code === 'too_large'){ m.textContent = tx('m_tooBig'); m.classList.add('err'); }
      else { m.textContent = tx('m_saveFail'); m.classList.add('err'); }
    }
    return;
  }
  try{
    const a = document.createElement('a'); a.href = resUrl; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    m.textContent = tx('m_hold');
  }catch(e){ m.textContent = tx('m_saveFail'); }
});

$('thBg').addEventListener('input', e => { S.themeBg = e.target.value; applyTheme(); saveSettings(); });
$('thAc').addEventListener('input', e => { S.themeAccent = e.target.value; applyTheme(); saveSettings(); });

/* ---------- install as an app (works when opened from its own https address) ---------- */
(function(){
  let top = false; try{ top = window.top === window.self; }catch(e){}
  if(!top || location.protocol !== 'https:') return;
  try{
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  }catch(e){}
  let offer = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); offer = e; $('install').hidden = false; });
  $('install').addEventListener('click', async () => { if(!offer) return; offer.prompt(); try{ await offer.userChoice; }catch(e){} offer = null; $('install').hidden = true; });
  window.addEventListener('appinstalled', () => { $('install').hidden = true; $('installNote').dataset.i = 'installed'; $('installNote').textContent = tx('installed'); });
  if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) { $('installNote').dataset.i = 'installed'; $('installNote').textContent = tx('installed'); }
})();

/* ---------- language ---------- */
function applyLang(){
  LANG = pickLang(); rootEl.lang = LANG; rootEl.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i]').forEach(e => { e.textContent = tx(e.dataset.i); });
  document.querySelectorAll('[data-i-ph]').forEach(e => { e.placeholder = tx(e.dataset.iPh); });
  document.querySelectorAll('[data-i-aria]').forEach(e => { e.setAttribute('aria-label', tx(e.dataset.iAria)); });
  document.querySelectorAll('[data-set="target"] .chip').forEach(b => { const v = parseInt(b.dataset.v, 10); b.textContent = v < 60 ? v + ' ' + tx('u_s') : (v/60) + ' ' + tx('u_min'); });
  $('langCode').textContent = LANG.toUpperCase(); $('langSel').value = LANG;
  if(!musicUrl) $('musicName').textContent = tx('noMusic');
  if(!running) $('play').textContent = tx('watch');
  syncControls(); renderClips();
}
LANGS.forEach(([code, name]) => { const o = document.createElement('option'); o.value = code; o.textContent = name; $('langSel').append(o); });
$('langSel').addEventListener('change', e => { S.lang = e.target.value; saveSettings(); setMsg(''); applyLang(); });
$('themeBtn').addEventListener('click', () => {
  const dark = getComputedStyle(rootEl).colorScheme.indexOf('dark') >= 0 || rootEl.getAttribute('data-theme') === 'dark';
  S.theme = dark ? 'light' : 'dark'; syncControls(); saveSettings(); applyTheme();
});

/* ---------- tabs ---------- */
function showTab(name){
  document.querySelectorAll('.panel').forEach(p => { p.hidden = p.dataset.panel !== name; });
  document.querySelectorAll('.tabs button').forEach(b => { b.setAttribute('aria-selected', String(b.dataset.tab === name)); });
  const y = document.querySelector('header').offsetHeight; if(window.scrollY > y) window.scrollTo(0, y);
  const act = document.querySelector('.tabs button[aria-selected="true"]');
  if(act && act.scrollIntoView){ try{ act.scrollIntoView({block:'nearest', inline:'center'}); }catch(e){} }
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));

/* ---------- boot ---------- */
applyTheme();
sizeCanvas(false);
if(!initGL()){ $('empty').dataset.i = 'm_noGL'; }
applyLang(); showTab('clips'); blank();
try{ if(document.fonts && document.fonts.load) document.fonts.load('500 40px Unbounded').catch(()=>{}); }catch(e){}
window.__sklejka = { err: () => glError };
})();
</script>
