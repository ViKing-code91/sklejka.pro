<div class="wrap">
<header>

</div>
</div>

</div>

float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
float vnoise(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f); return mix(mix(hash(i), hash(i + vec2(1., 0.)), f.x), mix(hash(i + vec2(0., 1.)), hash(i + vec2(1., 1.)), f.x), f.y); }
float fbm(vec2 p){ float a = .5, s = 0.; for(int i=0;i<4;i++){ s += a*vnoise(p); p = p*2.03 + 7.1; a *= .5; } return s; }
vec3 soft(sampler2D s, vec2 uv){
  vec2 d = vec2(.012, .02);

}
vec2 vuv(vec4 xf, float rot, mat2 m, vec2 p){

}
vec3 layer(sampler2D tex, sampler2D texS, vec4 xf, vec4 bg, float fit, float rot, mat2 m, vec2 p){
  vec2 uv = vuv(xf, rot, m, p);
  if(uv.x < 0. || uv.x > 1. || uv.y < 0. || uv.y > 1.){
    if(fit > .5) return soft(texS, clamp(vuv(bg, 0., m, p), 0., 1.))*.5;
    return vec3(0.);
  }

    c = vec3(texture2D(tex, clamp(uv+d,0.,1.)).r, texture2D(tex, uv).g, texture2D(tex, clamp(uv-d,0.,1.)).b);
  } else c = texture2D(tex, uv).rgb;

  return c;
}
vec3 low(sampler2D texS, vec4 xf, float rot, mat2 m, vec2 p){ return soft(texS, clamp(vuv(xf, rot, m, p), 0., 1.)); }
vec3 A(vec2 p){ return layer(uA, uAs, uAx, uAbg, uAfit, uAr, uAm, p); }
vec3 B(vec2 p){ return layer(uB, uBs, uBx, uBbg, uBfit, uBr, uBm, p); }
float streaks(vec2 p, float asp, float t, float sc, float sp, float slant){

}
float flakes(vec2 p, float asp, float t, float n, float fall, float size, float blur, float seed){
  vec2 u = vec2(p.x*asp, p.y)*n; u.y -= t*fall; u.x += sin(t*.5 + seed)*.3 + sin(u.y*.6 + seed*3.)*.25;

  float d = length(f - o), sz = size*(.5 + rnd);

float lum(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
vec3 grade(vec3 c){
  vec3 o = c;
  c *= uGain;
  float L = lum(c);
  c += uShadow*(1.-L)*(1.-L);
  c = clamp(c, 0., 1.);
